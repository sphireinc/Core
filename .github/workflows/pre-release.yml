name: pre-release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  pre-release:
    name: Pre Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Build development artifacts
        run: |
          mkdir -p dist

          GOOS=linux   GOARCH=amd64 go build -ldflags "-X github.com/sphireinc/core/v1.Version=latest" -o dist/core-linux-amd64   ./cmd/example
          GOOS=darwin  GOARCH=arm64 go build -ldflags "-X github.com/sphireinc/core/v1.Version=latest" -o dist/core-darwin-arm64  ./cmd/example
          GOOS=windows GOARCH=amd64 go build -ldflags "-X github.com/sphireinc/core/v1.Version=latest" -o dist/core-windows-amd64.exe ./cmd/example

      - name: Create or update pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Development Build
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            LICENSE.txt
            dist/core-linux-amd64
            dist/core-darwin-arm64
            dist/core-windows-amd64.exe